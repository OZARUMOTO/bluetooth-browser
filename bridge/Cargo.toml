[package]
name = "surf-bridge"
version = "0.1.0"
edition = "2021"
description = "QL-over-BLE bridge: connects Passport Prime directly to the surf-relay — no phone, no Envoy"

[dependencies]
# Foundation's own QL stack from OUR fork (same tag Envoy uses, with the
# dojo-vault backports: ScripthashListUnspent/ScripthashUtxos wire variants).
foundation-api = { git = "https://github.com/OZARUMOTO/foundation-api", tag = "5.6.2-dojo-vault" }
btp = { git = "https://github.com/OZARUMOTO/foundation-api", tag = "5.6.2-dojo-vault" }

btleplug = "0.12"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }

hex = "0.4"
uuid = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
